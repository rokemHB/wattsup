name: Release

# A tag vX.Y.Z builds the app for Linux, Windows and macOS and publishes a GitHub Release with
# the installers attached; the notes come from that version's section in CHANGELOG.md.
# A push to a release branch (release/X.Y) runs the same builds as a dress rehearsal: the
# installers become workflow artifacts and nothing is published. See docs/RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    branches: ["release/**"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version${{ github.ref_type == 'tag' && ', draft release' || '' }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree (with the tag, if this is one)
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"
          else tag="v$(node -p 'require("./package.json").version')"; fi
          tools/release/check-version.sh "$tag"
          tools/release/notes.sh "${tag#v}" > notes.md
          cat notes.md
      - name: Draft the release
        id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A re-run of the workflow reuses the draft it made the first time. The id of a new
          # draft comes from the create call itself: the release list may not show a draft
          # made a moment ago (v0.1.0 went out empty that way).
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -1)
          if [ -z "$id" ]; then
            pre=false
            case "$tag" in *-*) pre=true ;; esac
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" -f name="WattsUp ${tag#v}" -F body=@notes.md \
              -F draft=true -F prerelease=$pre --jq .id)
          fi
          [ -n "$id" ] || { echo "no release id for $tag" >&2; exit 1; }
          echo "release $tag has id $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than the newest Ubuntu: an AppImage runs on systems with the glibc it
          # was built against or newer.
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
            artifact: linux-x86_64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            args: ""
            artifact: linux-arm64
          - name: Windows x64
            os: windows-latest
            args: ""
            artifact: windows-x64
          # One app for Apple Silicon and Intel Macs.
          - name: macOS universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-3-dev pkg-config patchelf libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A tag needs its release id
        if: github.ref_type == 'tag' && needs.prepare.outputs.release_id == ''
        run: exit 1
      # With a release id the installers are uploaded to that draft; without one (a release
      # branch) tauri-action only builds them.
      - name: Build${{ github.ref_type == 'tag' && ' and upload' || '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
      - name: Keep the installers (dress rehearsal)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: wattsup-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft, if the installers are there
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '[.assets[] | select(.name | test("\\.(dmg|exe|msi|AppImage|deb|rpm)$"))] | length')
          echo "$n installers attached"
          [ "$n" -ge 9 ] || { echo "expected 9 installers; the release stays a draft" >&2; exit 1; }
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false --jq .html_url
