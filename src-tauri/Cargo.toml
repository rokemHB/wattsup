[package]
name = "wattsup"
description = "WattsUp desktop app (Tauri v2 shell around wattsup-engine)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wattsup-core = { path = "../crates/core" }
wattsup-devices = { path = "../crates/devices" }
wattsup-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Keeping the screen on during a ride (idle.rs): GTK's own Wayland connection.
gtk = "0.18"
gdkwayland-sys = "0.18"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
