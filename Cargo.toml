[workspace]
resolver = "2"
members = ["crates/core", "crates/devices", "crates/engine", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rokemHB/wattsup"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
